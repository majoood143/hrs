<script type="text/javascript">

	//On Doc Ready
	$(document).ready(function()
	{ 
		
		//loadInlineRaceContent();

		$('.js-mainIndex').button({
			    icons: {
				primary: "ui-button-icon-primary ui-icon ui-icon-home"
			}
		});

		$('.js-mainIndex').bind('click',function(event){
			event.preventDefault();
			var pageLink = "http://185.64.25.43//index.cfm"
			window.location = pageLink;
		});

		setTimeout(function() {
			$('.loaderMain').hide();
			$('.calendarContainer').show();
			iframeWrapperResize();
		}, 1500);


		var frmObj = $("#frmRaceCalSeason");
		
		frmObj.find("[name='season']").bind('change',function(event){
			event.preventDefault();
			var startingMonth = "9";
			var minYear = this.value.substring(0,2);
			minYear = (minYear > 50) ? ('19' + minYear) : ('20' + minYear);

			calendarChangeSeasonRange({
										  calendarSelector:'.datepicker'
										 ,minYear:minYear 
										 ,month:startingMonth
									 });
		});

		
			$.datepicker.setDefaults($.datepicker.regional['en']);
		
			var startingDate  = new Date("2026", "9",1);
		

		////////////////////////
		// OnLoad
		///////////////////////
		$('.datepicker').datepicker(
		{
			onSelect: function(dateText, inst)
			{
				var raceDate = inst.selectedYear + '-' + (inst.selectedMonth + 1) + '-' + inst.selectedDay;
				var checkURL = 'components/race.cfc?method=getRaceLinkByDate&raceDate=' + raceDate;
		
				$.ajax(
				{
					type: "GET",
					url: checkURL,
					dataType: "json",
					success: function(result)
							{
								var rootURL = "http://185.64.25.43/";
								rootURL += result.PAGE;
								window.location = rootURL;
								return false;						
							},
					error: function(result)
							{
								
							}
				});

			},
			onChangeMonthYear: function(year, month) 
			{
				updateRaceDays(year,month,9,'');
			},
			beforeShowDay: function(date)
			{
				//Get Race Days
				return highlightRaceDays(date);
			},
			numberOfMonths: [3, 4],
			stepMonths: 9,
			dateFormat: 'yyyy-mm-dd',
			defaultDate:startingDate
	
		});
		
		

		//Update Race Dates + Load Date Picker
		
			updateRaceDays(2026,10,9,'');
		

	});
