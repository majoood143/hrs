<script type="text/javascript">

	var statType 			= 'trainer';
	//var $openRaceTab 		= $('#tabsRace').find('.js-raceTab').not('.ui-tabs-hide');
	var $openRaceTab 		= $('.mainWrapper:visible');
	var $raceTabsObj 		= $openRaceTab.find('.tabsPopRaceInfo.' + statType); //prevents conflict between owner + trainer tabs
	var $altPopRaceObj 		= $openRaceTab.find('.altPopRace');
	var $altPopHorseObj 	= $openRaceTab.find('.altPopHorse');


	//On Doc Ready
	$(document).ready(function()
	{ 
		////////////////////////
		// OnLoad
		///////////////////////
	   
		//Tabs
		$(function()
		{
			$raceTabsObj.tabs(
			{
				show: function(event, ui)
				{						
					//Reset Arrow
					var tabNo = ui.tab.hash.replace("#tabPopRaceInfo_", '')
					var selectorTabs = $('#tabsPopRaceInfo');
					selectorTabs.find('.ui-icon-triangle-1-s').removeClass('ui-icon-triangle-1-s').addClass('ui-icon-triangle-1-e');
					$('#tabPopRaceInfoHeader_' + tabNo).find('.arrow').removeClass('ui-icon-triangle-1-e').addClass('ui-icon-triangle-1-s');
                    iframeWrapperResize();
				}
			});
		});
		
		////////////////////////
		// Events
		///////////////////////
		
		//Race
		$altPopRaceObj.bind('click',function()
		{
			// var req_url = 'pages/RaceResults.cfm?raceFile=' + $(this).attr('rel') + '&returnOption=true'

			// $('body').load(req_url, {}, function (responseText, textStatus, XMLHttpRequest)
			// {
			// 	raceTabSelected(true);
			// });

			var pageLink = "http://185.64.25.43//?page=RaceResults&racefile=" + $(this).attr('rel') + '&returnOption=true'
			window.location = pageLink;
			return false;
		});
		
		//Alt Pop Horse Info
		$altPopHorseObj.bind('click',function(event)
		{
			event.stopImmediatePropagation();

			popInfo(
			{
				title:            '',
				page:              'Horse_GenWin',
				miscParam:         'horseID=' + $(this).attr('rel'),
				id:                 $(this).attr('rel'),
				name:               $(this).text().trim(),
				containerClass:     'js-horseDetails',
				menuType:           'horse'
			});
		});	

	});
</script>
