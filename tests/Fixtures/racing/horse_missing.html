		<script type="text/javascript">

			var $horseTabsObj 		= $('.tabsPopHorse');
			var $altOwnerObj   		= $('.altPopOwner');
			var $altTrainerObj  	= $('.altPopTrainer');
			var $altJockeyObj   	= $('.altPopJockey');
			var $altPopRaceObj 		= $('.altPopRace');

			//On Doc Ready
			$(document).ready(function()
			{
				////////////////////////
				// OnLoad
				///////////////////////

				$(".cphoto").click(function()
				{
					parent.$.fn.colorbox({
											href:$(this).attr('href'),
											transition:"elastic",
											maxWidth:'100%',
											maxHeight:'100%',
											onOpen:function(){

																parent.$('#colorbox').bind('click',function()
																{
																	parent.$.colorbox.close();
																});
															 }
										 });
					return false;
				});

				//Tabs
				$(function()
				{
					$horseTabsObj.tabs(
					{
						show: function(event, ui)
						{
							//Reset Arrow
							var tabNo = ui.tab.hash.replace("#tabPopHorse_", '')
							var selectorTabs = $('#tabsPopHorse');
							selectorTabs.find('.ui-icon-triangle-1-s').removeClass('ui-icon-triangle-1-s').addClass('ui-icon-triangle-1-e');
							$('#tabPopHorseHeader_' + tabNo).find('.arrow').removeClass('ui-icon-triangle-1-e').addClass('ui-icon-triangle-1-s');
                            iframeWrapperResize();
						}
					});
				});

				////////////////////////
				// Events
				///////////////////////

				$altPopRaceObj.bind('click',function()
				{
					// var req_url = 'pages/RaceResults.cfm?raceFile=' + $(this).attr('rel') + '&returnOption=true'

					// $('body').load(req_url, {}, function (responseText, textStatus, XMLHttpRequest)
					// {
					// 	raceTabSelected(true);
					// });	

					var pageLink = "http://185.64.25.43//?page=RaceResults&racefile=" + $(this).attr('rel') + '&returnOption=true'
					window.location = pageLink;
					return false;
				});

				//Alt Pop Jockey Info
				$altJockeyObj.bind('click',function(event)
				{
					event.stopImmediatePropagation();

					popInfo(
					{
						title:              '',
						page:               'Jockey_GenWin',
						miscParam:          'jockeyID=' + $(this).attr('rel'),
						id:                 $(this).attr('rel'),
						name:               $(this).text().trim(),
						containerClass:     'js-jockeyDetails',
						menuType:           'jockey'
					});
				});

				//Pop Owner Info
				$altOwnerObj.bind('click',function(event)
				{
					event.stopImmediatePropagation();

					popInfo(
					{
						title: 			    '',
						page: 			    'Owner_GenWin',
						miscParam: 		    'ownerID=' + $(this).attr('rel'),
						id:                 $(this).attr('rel'),
						name:               $(this).text().trim(),
						containerClass:     'js-ownerDetails',
						menuType:           'owner'
					});
				});

				//Pop Trainer Info
				$altTrainerObj.bind('click',function(event)
				{
					event.stopImmediatePropagation();

					popInfo(
					{
						title: 			    '',
						page: 			    'Trainer_GenWin',
						miscParam: 		    'trainerID=' + $(this).attr('rel'),
						id:                 $(this).attr('rel'),
						name:               $(this).text().trim(),
						containerClass:     'js-trainerDetails',
						menuType:           'trainer'
					});
				})

			});
        </script>
